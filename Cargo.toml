[package]
name = "radial-menu-rs"
version = "0.1.1"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust radial menu and weapon wheel system with angle math, deadzone filtering, and easing animations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/radial-menu-rs"
homepage = "https://bhubbard.github.io/radial-menu-rs/"
readme = "README.md"
keywords = ["radial-menu", "weapon-wheel", "pie-menu", "gamedev", "input"]
categories = ["game-development", "gui", "math"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
